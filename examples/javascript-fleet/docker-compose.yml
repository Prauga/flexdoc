services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  docs-1: &docs
    build: .
    environment: &docs-env
      # One secret for every replica. Generate with: openssl rand -base64 48
      FLEXDOC_SESSION_SECRET: ${FLEXDOC_SESSION_SECRET:?set FLEXDOC_SESSION_SECRET}
      FLEXDOC_INSTANCES: "3"
      REDIS_URL: redis://redis:6379
      PUBLIC_ORIGIN: http://localhost:8080
      INSTANCE_ID: docs-1
    depends_on: [redis]
    ports: ["3001:3000"]

  docs-2:
    <<: *docs
    environment:
      <<: *docs-env
      INSTANCE_ID: docs-2
    ports: ["3002:3000"]

  docs-3:
    <<: *docs
    environment:
      <<: *docs-env
      INSTANCE_ID: docs-3
    ports: ["3003:3000"]

  lb:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [docs-1, docs-2, docs-3]
