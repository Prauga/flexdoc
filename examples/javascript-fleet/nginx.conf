events {}

http {
  # Round-robin on purpose: with the shared secret and Redis jar store in place,
  # affinity is not needed, and running without it is the only way to prove that.
  upstream docs {
    server docs-1:3000;
    server docs-2:3000;
    server docs-3:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://docs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
