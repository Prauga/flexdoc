openapi: 3.1.0
info:
  title: CLI Fixture API
  version: 1.0.0
servers:
  - url: https://api.example.test
paths:
  /pets/{id}:
    get:
      summary: Get a pet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: '42'
      responses:
        '200':
          description: Pet response
          content:
            application/json:
              schema:
                $ref: ./models.yaml#/$defs/Pet
