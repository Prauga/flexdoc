name: Transport UX Size Trim

on:
  push:
    branches:
      - feat/3.3.1-transport-ux

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - name: Measure current ES2020 build
        run: |
          npm run build:client
          node - <<'NODE'
          const fs=require('fs'),z=require('zlib');
          const f=fs.readFileSync('packages/client/dist/standalone/flexdoc.standalone.js');
          console.log(`CURRENT_RAW=${f.length}`);
          console.log(`CURRENT_GZIP=${z.gzipSync(f,{level:9}).length}`);
          console.log(`CURRENT_BROTLI=${z.brotliCompressSync(f,{params:{[z.constants.BROTLI_PARAM_QUALITY]:11}}).length}`);
          NODE
      - name: Measure hidden source map build
        run: |
          sed -i "s/sourcemap: true/sourcemap: 'hidden'/" packages/client/vite.standalone.config.ts
          npm run build:client
          node -e "const f=require('fs').readFileSync('packages/client/dist/standalone/flexdoc.standalone.js');console.log('HIDDEN_MAP_RAW='+f.length)"
      - name: Measure ES2022 hidden-map build
        run: |
          sed -i "s/target: 'es2020'/target: 'es2022'/" packages/client/vite.standalone.config.ts
          npm run build:client
          node - <<'NODE'
          const fs=require('fs'),z=require('zlib');
          const f=fs.readFileSync('packages/client/dist/standalone/flexdoc.standalone.js');
          console.log(`ES2022_RAW=${f.length}`);
          console.log(`ES2022_GZIP=${z.gzipSync(f,{level:9}).length}`);
          console.log(`ES2022_BROTLI=${z.brotliCompressSync(f,{params:{[z.constants.BROTLI_PARAM_QUALITY]:11}}).length}`);
          NODE
