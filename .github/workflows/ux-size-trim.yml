name: Transport UX Size Attribution

on:
  push:
    branches:
      - feat/3.3.1-transport-ux

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - name: Build standalone renderer
        run: npm run build:client
      - name: Attribute generated bytes
        run: |
          python3 - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          values = {c:i for i,c in enumerate(alphabet)}
          def vlq(segment):
              out=[]; value=shift=0
              for ch in segment:
                  digit=values[ch]; value |= (digit & 31) << shift
                  if digit & 32:
                      shift += 5
                      continue
                  negative=value & 1
                  out.append(-(value >> 1) if negative else value >> 1)
                  value=shift=0
              return out

          js = Path('packages/client/dist/standalone/flexdoc.standalone.js').read_bytes()
          sm = json.loads(Path('packages/client/dist/standalone/flexdoc.standalone.js.map').read_text())
          totals=defaultdict(int)
          source=0
          generated_line_start=0
          js_text=js.decode('utf-8')
          line_lengths=[len(line.encode('utf-8')) + 1 for line in js_text.splitlines()]
          mappings=sm['mappings'].split(';')
          for line_no, line in enumerate(mappings):
              generated=0
              segments=[]
              for raw in line.split(',') if line else []:
                  fields=vlq(raw)
                  if not fields: continue
                  generated += fields[0]
                  src=None
                  if len(fields) >= 4:
                      source += fields[1]
                      src=source
                  segments.append((generated, src))
              line_len = line_lengths[line_no] if line_no < len(line_lengths) else 0
              for idx,(col,src) in enumerate(segments):
                  end=segments[idx+1][0] if idx+1 < len(segments) else max(0,line_len-1)
                  if src is not None and 0 <= src < len(sm['sources']):
                      totals[sm['sources'][src]] += max(0,end-col)
          print(f'TOTAL_RAW={len(js)}')
          for src,size in sorted(totals.items(), key=lambda x:x[1], reverse=True)[:50]:
              print(f'{size:8d} {src}')
          PY
