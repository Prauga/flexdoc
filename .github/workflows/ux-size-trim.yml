name: Transport UX Size Hygiene

on:
  push:
    branches:
      - feat/3.3.1-transport-ux

permissions:
  contents: write

jobs:
  trim:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - name: Apply guarded size hygiene
        run: node scripts/ux-size-trim.mjs
      - name: Validate client
        run: |
          npm run lint
          npm test -w packages/client -- --runInBand
      - name: Build and measure
        run: |
          npm run build:client
          node - <<'NODE'
          const fs=require('fs'),z=require('zlib');
          const f=fs.readFileSync('packages/client/dist/standalone/flexdoc.standalone.js');
          console.log(`FLEXDOC_RAW=${f.length}`);
          console.log(`FLEXDOC_HEADROOM=${862208-f.length}`);
          console.log(`FLEXDOC_GZIP=${z.gzipSync(f,{level:9}).length}`);
          console.log(`FLEXDOC_BROTLI=${z.brotliCompressSync(f,{params:{[z.constants.BROTLI_PARAM_QUALITY]:11}}).length}`);
          NODE
      - name: Synchronize adapter assets
        run: npm run sync:adapter-assets
      - name: Commit validated hygiene
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/client/src \
            adapters/elixir/assets/flexdoc.standalone.js \
            adapters/go/assets/flexdoc.standalone.js \
            adapters/php/assets/flexdoc.standalone.js \
            adapters/python/src/prauga_flexdoc/_assets/flexdoc.standalone.js \
            adapters/ruby/assets/flexdoc.standalone.js \
            adapters/rust-actix/assets/flexdoc.standalone.js \
            adapters/rust/assets/flexdoc.standalone.js
          git diff --cached --check
          git commit -m 'chore: renderer/size: reduce validation and history overhead' -m 'Remove redundant validation allocations, standalone method state, and an internal double-clone on recent history replay without changing public behavior.'
          git push origin HEAD:feat/3.3.1-transport-ux
