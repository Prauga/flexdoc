name: Publish Java Adapters to Maven Central

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-sign-and-publish:
    if: startsWith(github.event.release.tag_name, 'java/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Setup Java and Maven Central credentials
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build canonical standalone renderer
        run: npm run build:client

      - name: Verify Java release tag matches family version
        run: |
          VERSION=$(mvn -q -f adapters/java/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
          test "${{ github.event.release.tag_name }}" = "java/v${VERSION}"

      - name: Build Java family and verify local dependency graph
        run: mvn -f adapters/java/pom.xml --batch-mode install

      - name: Verify renderer assets before publication
        run: |
          VERSION=$(mvn -q -f adapters/java-jvm/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
          JAR="adapters/java-jvm/target/flexdoc-jvm-${VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep 'META-INF/flexdoc/flexdoc.standalone.js'
          jar tf "$JAR" | grep 'META-INF/flexdoc/flexdoc.standalone.css'

      - name: Sign and publish JVM host
        run: mvn -f adapters/java-jvm/pom.xml --batch-mode -Prelease -Dgpg.signer=bc deploy
        env: &central_env
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Sign and publish Jakarta REST adapter
        run: mvn -f adapters/java-jaxrs/pom.xml --batch-mode -Prelease -Dgpg.signer=bc deploy
        env: *central_env

      - name: Sign and publish Spring Boot starter
        run: mvn -f adapters/java-spring/pom.xml --batch-mode -Prelease -Dgpg.signer=bc deploy
        env: *central_env
