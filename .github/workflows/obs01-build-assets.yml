name: OBS-01 Build Assets

on:
  push:
    branches:
      - feat/3.3.x-history-privacy

permissions:
  contents: write

jobs:
  build-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply guarded privacy trim
        run: node scripts/obs01-trim.mjs
      - name: Validate privacy source
        run: |
          npm run lint
          npm test -w packages/client -- --runInBand
      - name: Build canonical renderer
        run: npm run build:client
      - name: Report standalone bundle sizes
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const file = fs.readFileSync('packages/client/dist/standalone/flexdoc.standalone.js');
          console.log(`FLEXDOC_BUNDLE_RAW_BYTES=${file.length}`);
          console.log(`FLEXDOC_BUNDLE_GZIP_BYTES=${zlib.gzipSync(file, { level: 9 }).length}`);
          console.log(`FLEXDOC_BUNDLE_BROTLI_BYTES=${zlib.brotliCompressSync(file, { params: { [zlib.constants.BROTLI_PARAM_QUALITY]: 11 } }).length}`);
          NODE
      - name: Synchronize adapter renderer assets
        run: npm run sync:adapter-assets
      - name: Commit validated privacy trim and assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/client/src \
            adapters/elixir/assets/flexdoc.standalone.js \
            adapters/go/assets/flexdoc.standalone.js \
            adapters/php/assets/flexdoc.standalone.js \
            adapters/python/src/prauga_flexdoc/_assets/flexdoc.standalone.js \
            adapters/ruby/assets/flexdoc.standalone.js \
            adapters/rust-actix/assets/flexdoc.standalone.js \
            adapters/rust/assets/flexdoc.standalone.js
          git diff --cached --check
          git commit -m 'fix: api-client/privacy: compact history privacy persistence' -m 'Keep OBS-01 semantics while reducing private preference, sanitizer, and history-toggle overhead; then synchronize committed renderer assets.'
          git push origin HEAD:feat/3.3.x-history-privacy
