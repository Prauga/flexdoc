name: OBS-01 Combined Size Measurement

on:
  push:
    branches:
      - feat/3.3.x-history-privacy

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout privacy branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Assemble latest transport UX tree
        run: |
          git fetch origin feat/3.3.1-transport-ux
          git config user.name 'stack-measure'
          git config user.email 'stack-measure@invalid'
          git merge --no-ff --no-commit origin/feat/3.3.1-transport-ux || true
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          printf 'STACK_CONFLICT=%s\n' "${conflicts[@]}"
          for path in "${conflicts[@]}"; do
            case "$path" in
              adapters/elixir/assets/flexdoc.standalone.js|adapters/go/assets/flexdoc.standalone.js|adapters/php/assets/flexdoc.standalone.js|adapters/python/src/prauga_flexdoc/_assets/flexdoc.standalone.js|adapters/ruby/assets/flexdoc.standalone.js|adapters/rust-actix/assets/flexdoc.standalone.js|adapters/rust/assets/flexdoc.standalone.js)
                git checkout --theirs -- "$path"; git add "$path" ;;
              *) echo "Unexpected source conflict: $path"; exit 1 ;;
            esac
          done
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Apply guarded combined cleanup
        run: node scripts/obs01-trim.mjs
      - name: Attribute repeated static source strings
        run: |
          python3 - <<'PY'
          import re
          from collections import defaultdict
          from pathlib import Path
          by_file=defaultdict(lambda: defaultdict(int))
          pattern=re.compile(r"(['\"])([^'\"\n]{24,})\1")
          for path in Path('packages/client/src').rglob('*'):
              if path.suffix not in {'.ts','.tsx'} or path.name.endswith('.test.ts') or path.name.endswith('.test.tsx'):
                  continue
              text=path.read_text()
              for _, value in pattern.findall(text):
                  by_file[str(path)][value]+=1
          rows=[]
          for path, values in by_file.items():
              for value,count in values.items():
                  if count > 1:
                      rows.append(((len(value)-4)*(count-1),count,len(value),path,value))
          for saving,count,length,path,value in sorted(rows, reverse=True)[:60]:
              print(f'REPEAT saving~{saving:4d} count={count:2d} len={length:3d} {path}: {value}')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate combined client
        run: |
          npm run lint
          npm test -w packages/client -- --runInBand
      - name: Build and measure combined standalone renderer
        run: |
          npm run build:client
          node - <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const file = fs.readFileSync('packages/client/dist/standalone/flexdoc.standalone.js');
          console.log(`STACKED_RAW=${file.length}`);
          console.log(`STACKED_HEADROOM=${862208-file.length}`);
          console.log(`TARGET_MARGIN=${861184-file.length}`);
          console.log(`STACKED_GZIP=${zlib.gzipSync(file, { level: 9 }).length}`);
          console.log(`STACKED_BROTLI=${zlib.brotliCompressSync(file, { params: { [zlib.constants.BROTLI_PARAM_QUALITY]: 11 } }).length}`);
          NODE
