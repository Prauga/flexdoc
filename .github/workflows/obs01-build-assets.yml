name: OBS-01 Workspace Privacy Validation

on:
  push:
    branches:
      - feat/3.3.x-history-privacy

permissions:
  contents: write

jobs:
  validate-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout privacy branch
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply workspace-backed privacy mode
        run: node scripts/obs01-trim.mjs
      - name: Validate privacy source
        run: |
          npm run lint
          npm test -w packages/client -- --runInBand
      - name: Build and measure standalone renderer
        run: |
          npm run build:client
          node - <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const file = fs.readFileSync('packages/client/dist/standalone/flexdoc.standalone.js');
          console.log(`OBS01_RAW=${file.length}`);
          console.log(`OBS01_HEADROOM=${862208-file.length}`);
          console.log(`OBS01_GZIP=${zlib.gzipSync(file, { level: 9 }).length}`);
          console.log(`OBS01_BROTLI=${zlib.brotliCompressSync(file, { params: { [zlib.constants.BROTLI_PARAM_QUALITY]: 11 } }).length}`);
          NODE
      - name: Synchronize adapter renderer assets
        run: npm run sync:adapter-assets
      - name: Commit validated privacy refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/client/src \
            adapters/elixir/assets/flexdoc.standalone.js \
            adapters/go/assets/flexdoc.standalone.js \
            adapters/php/assets/flexdoc.standalone.js \
            adapters/python/src/prauga_flexdoc/_assets/flexdoc.standalone.js \
            adapters/ruby/assets/flexdoc.standalone.js \
            adapters/rust-actix/assets/flexdoc.standalone.js \
            adapters/rust/assets/flexdoc.standalone.js
          git diff --cached --check
          git commit -m 'fix: api-client/privacy: persist history mode with workspace' -m 'Keep the OBS-01 privacy toggle in IndexedDB workspace state, remove duplicate localStorage/React plumbing, preserve conservative body omission for host and legacy history, and regenerate adapter renderer assets.'
          git push origin HEAD:feat/3.3.x-history-privacy
