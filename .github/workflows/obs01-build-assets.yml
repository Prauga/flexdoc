name: OBS-01 Finalize Validated Stack

on:
  push:
    branches:
      - feat/3.3.x-history-privacy

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout privacy branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restack on latest transport UX
        run: |
          git fetch origin feat/3.3.1-transport-ux
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit origin/feat/3.3.1-transport-ux || true
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          printf 'STACK_CONFLICT=%s\n' "${conflicts[@]}"
          for path in "${conflicts[@]}"; do
            case "$path" in
              adapters/elixir/assets/flexdoc.standalone.js|adapters/go/assets/flexdoc.standalone.js|adapters/php/assets/flexdoc.standalone.js|adapters/python/src/prauga_flexdoc/_assets/flexdoc.standalone.js|adapters/ruby/assets/flexdoc.standalone.js|adapters/rust-actix/assets/flexdoc.standalone.js|adapters/rust/assets/flexdoc.standalone.js)
                git checkout --theirs -- "$path"; git add "$path" ;;
              *) echo "Unexpected source conflict: $path"; exit 1 ;;
            esac
          done
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Apply validated source cleanup
        run: |
          node scripts/obs01-trim.mjs
          node scripts/obs01-stage-fix.mjs
      - name: Install dependencies
        run: npm ci
      - name: Validate source
        run: |
          npm run lint
          npm test -w packages/client -- --runInBand
      - name: Build and enforce renderer budgets
        run: |
          npm run build:client
          node - <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const file = fs.readFileSync('packages/client/dist/standalone/flexdoc.standalone.js');
          const raw = file.length;
          const gzip = zlib.gzipSync(file, { level: 9 }).length;
          const brotli = zlib.brotliCompressSync(file, { params: { [zlib.constants.BROTLI_PARAM_QUALITY]: 11 } }).length;
          console.log(`FINAL_RAW=${raw}`);
          console.log(`FINAL_HEADROOM=${862208-raw}`);
          console.log(`FINAL_RESERVE_MARGIN=${861184-raw}`);
          console.log(`FINAL_GZIP=${gzip}`);
          console.log(`FINAL_BROTLI=${brotli}`);
          if (raw > 861184) throw new Error(`Raw bundle ${raw} exceeds 1 KiB reserve target 861184`);
          if (gzip > 266240) throw new Error(`Gzip bundle ${gzip} exceeds 260 KiB ceiling`);
          if (brotli > 225280) throw new Error(`Brotli bundle ${brotli} exceeds 220 KiB ceiling`);
          NODE
      - name: Synchronize adapter renderer assets
        run: npm run sync:adapter-assets
      - name: Commit validated product tree
        run: |
          git add packages/client/src \
            adapters/elixir/assets/flexdoc.standalone.js \
            adapters/go/assets/flexdoc.standalone.js \
            adapters/php/assets/flexdoc.standalone.js \
            adapters/python/src/prauga_flexdoc/_assets/flexdoc.standalone.js \
            adapters/ruby/assets/flexdoc.standalone.js \
            adapters/rust-actix/assets/flexdoc.standalone.js \
            adapters/rust/assets/flexdoc.standalone.js
          git diff --cached --check
          git commit -m 'fix: api-client/privacy: finalize persisted history hardening' -m 'Centralize IndexedDB sanitization, remove redundant history and viewer plumbing, deduplicate repeated field styles, restack on the latest transport UX base, and synchronize embedded renderer assets while preserving OBS-01 semantics and bundle headroom.'
          git push origin HEAD:feat/3.3.x-history-privacy
