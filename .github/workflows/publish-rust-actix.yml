name: Publish FlexDoc Actix adapter

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'rust-actix/v')
    runs-on: ubuntu-latest
    environment: crates-io
    concurrency:
      group: flexdoc-rust-crates-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Verify release tag
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('adapters/rust-actix/Cargo.toml','rb'))['package']['version'])")
          test "${{ github.event.release.tag_name }}" = "rust-actix/v${VERSION}"
      - run: cargo test --manifest-path adapters/rust-host-execution/Cargo.toml --all-targets
      - run: cargo test --manifest-path adapters/rust-actix/Cargo.toml --all-targets
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Ensure shared host-execution crate is published
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          HOST_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('adapters/rust-host-execution/Cargo.toml','rb'))['package']['version'])")
          if ! cargo info "prauga-flexdoc-host-execution@${HOST_VERSION}" >/dev/null 2>&1; then
            cargo publish --manifest-path adapters/rust-host-execution/Cargo.toml
          fi
          for attempt in $(seq 1 30); do
            if cargo info "prauga-flexdoc-host-execution@${HOST_VERSION}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "Shared Rust host-execution crate did not become visible on crates.io." >&2
          exit 1
      - run: cargo package --manifest-path adapters/rust-actix/Cargo.toml
      - name: Publish prauga-flexdoc-actix
        run: cargo publish --manifest-path adapters/rust-actix/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
