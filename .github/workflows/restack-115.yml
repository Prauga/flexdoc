name: Restack PR 115

on:
  push:
    branches:
      - tmp/3.3.x-restack-115

permissions:
  contents: write

jobs:
  restack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/3.3.x-execute-route-preflight
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Merge corrected transport base
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feat/3.3.1-transport-ux
          git merge --no-commit --no-ff -X ours origin/feat/3.3.1-transport-ux
          git diff --check
      - name: Validate and regenerate renderer assets
        run: |
          npm ci
          npm run lint
          npm test -w packages/client -- --runInBand
          npm run build:client
          npm run sync:adapter-assets
          npm run check:adapter-assets
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const data = fs.readFileSync('packages/client/dist/standalone/flexdoc.standalone.js');
          const sizes = {
            raw: data.length,
            gzip: zlib.gzipSync(data, { level: 9 }).length,
            brotli: zlib.brotliCompressSync(data, { params: { [zlib.constants.BROTLI_PARAM_QUALITY]: 11 } }).length,
          };
          const limits = { raw: 861184, gzip: 266240, brotli: 225280 };
          console.log(`Standalone renderer bytes: raw=${sizes.raw}, gzip=${sizes.gzip}, brotli=${sizes.brotli}`);
          for (const [kind, size] of Object.entries(sizes)) {
            if (size > limits[kind]) throw new Error(`${kind} renderer size ${size} exceeds ${limits[kind]}`);
          }
          NODE
          git diff --check
      - name: Commit and push
        run: |
          git add -A
          git commit -m 'chore: api-client/preflight: restack on corrected transport policy' -m 'Integrate the preferHostExecution ceiling fix beneath UX-06, regenerate embedded renderer assets from the combined source tree, and preserve the existing bundle ceilings.'
          git push origin HEAD:feat/3.3.x-execute-route-preflight
