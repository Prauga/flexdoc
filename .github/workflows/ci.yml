name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency audit
        run: npm run audit

      - name: Lint TypeScript sources
        run: npm run lint

      - name: Verify examples use current FlexDoc versions
        run: npm run check:example-versions

      - name: Install framework-neutral core dependencies
        run: npm install --prefix core --ignore-scripts --no-audit --no-fund

      - name: Test framework-neutral core
        run: npm test
        working-directory: core

      - name: Verify core package contents
        run: npm pack --dry-run
        working-directory: core

      - name: Test client
        run: npm test -w packages/client -- --runInBand

      - name: Build client and standalone renderer
        run: npm run build:client

      - name: Build React workspace examples
        run: |
          npm run build -w examples/basic-usage
          npm run build -w examples/interactive-demo
          npm run build -w examples/api-client

      - name: Verify packed client package from a clean consumer
        run: node scripts/verify-client-package.mjs

      - name: Test Go adapter
        run: |
          go test ./...
          test "$(go list -m)" = "github.com/prauga/flexdoc/adapters/go"
        working-directory: adapters/go

      - name: Verify Go example checksum pin
        run: node scripts/verify-go-example-sum.mjs

      - name: Build Go example against local release candidate
        run: |
          go mod edit -replace github.com/prauga/flexdoc/adapters/go=../../adapters/go
          go build ./...
          rm -f flexdoc-go-example
          git checkout -- go.mod go.sum
        working-directory: examples/go-net-http

      - name: Test and package Python ASGI adapter
        run: |
          python3 -m compileall -q adapters/python/src
          python3 -m unittest discover -s adapters/python/tests -v
          python3 -m pip install --disable-pip-version-check -q build
          rm -rf /tmp/flexdoc-python-dist adapters/python/build adapters/python/src/*.egg-info
          mkdir -p /tmp/flexdoc-python-dist
          python3 -m build --outdir /tmp/flexdoc-python-dist adapters/python
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path('/tmp/flexdoc-python-dist').glob('*.whl'))
          with ZipFile(wheel) as z:
              names = set(z.namelist())
          assert any(n.endswith('prauga_flexdoc/_assets/flexdoc.standalone.js') for n in names)
          assert any(n.endswith('prauga_flexdoc/_assets/flexdoc.standalone.css') for n in names)
          PY

      - name: Validate FastAPI example against local release candidate
        run: |
          grep -v '^prauga-flexdoc==' examples/python-fastapi/requirements.txt > /tmp/flexdoc-fastapi-requirements.txt
          python3 -m pip install --disable-pip-version-check -q -r /tmp/flexdoc-fastapi-requirements.txt /tmp/flexdoc-python-dist/*.whl
          python3 -m compileall -q examples/python-fastapi
          PYTHONPATH=examples/python-fastapi python3 -c "from app import app; assert app.openapi_url == '/openapi.json'"
          rm -rf adapters/python/build adapters/python/src/*.egg-info

      - name: Test Rust Axum adapter
        run: |
          cargo test --manifest-path adapters/rust/Cargo.toml --all-targets
          cargo package --manifest-path adapters/rust/Cargo.toml --allow-dirty

      - name: Build Rust example against local release candidate
        run: |
          cargo check --manifest-path examples/rust-axum/Cargo.toml --config 'patch.crates-io.prauga-flexdoc-axum.path="adapters/rust"'
          git checkout -- examples/rust-axum/Cargo.lock

      - name: Install CLI dependencies using local client bootstrap
        run: npm install --prefix tools/flexdoc-cli --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "${{ github.workspace }}/packages/client" js-yaml@^4.1.0

      - name: Test CLI build and serve contracts
        env:
          FLEXDOC_CLIENT_DIR: ${{ github.workspace }}/packages/client
        run: npm test --prefix tools/flexdoc-cli

      - name: Verify CLI package contents
        run: npm pack --dry-run
        working-directory: tools/flexdoc-cli

      - name: Verify language-neutral renderer contract
        run: |
          test -s packages/renderer-contract/flexdoc-renderer.schema.json
          node -e "JSON.parse(require('fs').readFileSync('packages/renderer-contract/flexdoc-renderer.schema.json', 'utf8'))"

      - name: Test backend
        run: npm test -w packages/backend -- --runInBand

      - name: Build backend with packaged renderer
        run: npm run build:backend

      - name: Build NestJS example against local release candidate
        run: npm run build -w examples/nestjs

      - name: Verify backend renderer artifacts
        run: |
          test -s packages/backend/dist/renderer/flexdoc.standalone.js
          test -s packages/backend/dist/renderer/flexdoc.standalone.css

      - name: Validate JavaScript backend examples against local release candidate
        run: |
          npm install --prefix examples/javascript-express --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "${{ github.workspace }}/packages/backend"
          npm install --prefix examples/javascript-fastify --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "${{ github.workspace }}/packages/backend"
          node --check examples/javascript-express/index.js
          node --check examples/javascript-fastify/index.js
          node - <<'NODE'
          const { buildApp: buildExpress } = require('./examples/javascript-express');
          const { buildApp: buildFastify } = require('./examples/javascript-fastify');
          (async () => {
            const express = buildExpress();
            const server = express.listen(0);
            await new Promise((resolve, reject) => {
              server.once('listening', resolve);
              server.once('error', reject);
            });
            try {
              const address = server.address();
              const response = await fetch(`http://127.0.0.1:${address.port}/docs`);
              if (!response.ok) throw new Error(`Express FlexDoc smoke test returned ${response.status}`);
            } finally {
              await new Promise((resolve) => server.close(resolve));
            }

            const fastify = await buildFastify();
            try {
              await fastify.ready();
              const response = await fastify.inject({ method: 'GET', url: '/docs' });
              if (response.statusCode !== 200) throw new Error(`Fastify FlexDoc smoke test returned ${response.statusCode}`);
            } finally {
              await fastify.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Test and install Java adapter family release candidate
        run: mvn -f adapters/java/pom.xml --batch-mode install

      - name: Verify JVM host packages renderer assets
        run: |
          JAVA_VERSION=$(mvn -q -f adapters/java-jvm/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
          JVM_JAR="adapters/java-jvm/target/flexdoc-jvm-${JAVA_VERSION}.jar"
          jar tf "$JVM_JAR" | grep 'META-INF/flexdoc/flexdoc.standalone.js'
          jar tf "$JVM_JAR" | grep 'META-INF/flexdoc/flexdoc.standalone.css'
          unzip -p "$JVM_JAR" META-INF/flexdoc/flexdoc.standalone.js > /tmp/flexdoc-jvm.js
          unzip -p "$JVM_JAR" META-INF/flexdoc/flexdoc.standalone.css > /tmp/flexdoc-jvm.css
          cmp /tmp/flexdoc-jvm.js packages/client/dist/standalone/flexdoc.standalone.js
          cmp /tmp/flexdoc-jvm.css packages/client/dist/standalone/flexdoc.standalone.css
          test -s "adapters/java-jvm/target/flexdoc-jvm-${JAVA_VERSION}-sources.jar"
          test -s "adapters/java-jvm/target/flexdoc-jvm-${JAVA_VERSION}-javadoc.jar"
          test -s "adapters/java-jaxrs/target/flexdoc-jaxrs-${JAVA_VERSION}-sources.jar"
          test -s "adapters/java-jaxrs/target/flexdoc-jaxrs-${JAVA_VERSION}-javadoc.jar"
          test -s "adapters/java-spring/target/flexdoc-spring-boot-starter-${JAVA_VERSION}-sources.jar"
          test -s "adapters/java-spring/target/flexdoc-spring-boot-starter-${JAVA_VERSION}-javadoc.jar"

      - name: Build Spring example against local release candidate
        run: mvn -f examples/java-spring/pom.xml --batch-mode -DskipTests package

      - name: Verify canonical and adapter renderer assets
        run: |
          test -s packages/client/dist/standalone/flexdoc.standalone.js
          test -s packages/client/dist/standalone/flexdoc.standalone.css
          npm run check:adapter-assets

      - name: Verify validation leaves the repository clean
        run: |
          rm -rf adapters/python/build adapters/python/src/*.egg-info
          if [ -n "$(git status --porcelain)" ]; then
            echo "Validation modified tracked or unignored repository files:"
            git status --short
            git diff
            exit 1
          fi
