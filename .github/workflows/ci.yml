name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-pr20-go-sum:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 20
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Materialize Go example checksums
        working-directory: examples/go-net-http
        run: go mod tidy

      - name: Commit Go module sums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/go-net-http/go.mod examples/go-net-http/go.sum
          if git diff --cached --quiet; then
            echo "Go example module files already materialized."
            exit 0
          fi
          git commit -m "Commit Go example module sums"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  test-and-build:
    name: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install dependencies
        run: npm ci

      - name: Verify examples use current FlexDoc versions
        run: npm run check:example-versions

      - name: Install framework-neutral core dependencies
        run: npm install --prefix core --ignore-scripts --no-audit --no-fund

      - name: Test framework-neutral core
        run: npm test
        working-directory: core

      - name: Verify core package contents
        run: npm pack --dry-run
        working-directory: core

      - name: Test client
        run: npm test -w packages/client -- --runInBand

      - name: Build client and standalone renderer
        run: npm run build:client

      - name: Verify packed client package from a clean consumer
        run: node scripts/verify-client-package.mjs

      - name: Verify canonical and adapter renderer assets
        run: |
          test -s packages/client/dist/standalone/flexdoc.standalone.js
          test -s packages/client/dist/standalone/flexdoc.standalone.css
          npm run check:adapter-assets

      - name: Test Go adapter
        run: |
          go test ./...
          test "$(go list -m)" = "github.com/prauga/flexdoc/adapters/go"
        working-directory: adapters/go

      - name: Build Go example against published adapter
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "Go example module files are stale. Run 'go mod tidy' in examples/go-net-http and commit the result."
            git diff -- go.mod go.sum
            exit 1
          fi
          go build ./...
        working-directory: examples/go-net-http

      - name: Test Python ASGI adapter
        run: |
          python3 -m compileall -q adapters/python/src
          python3 -m unittest discover -s adapters/python/tests -v
          python3 -m pip install --disable-pip-version-check -q build
          rm -rf adapters/python/dist
          python3 -m build --outdir adapters/python/dist adapters/python
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path('adapters/python/dist').glob('*.whl'))
          with ZipFile(wheel) as z:
              names = set(z.namelist())
          assert any(n.endswith('prauga_flexdoc/_assets/flexdoc.standalone.js') for n in names)
          assert any(n.endswith('prauga_flexdoc/_assets/flexdoc.standalone.css') for n in names)
          PY

      - name: Validate FastAPI example against published adapter
        run: |
          python3 -m pip install --disable-pip-version-check -q -r examples/python-fastapi/requirements.txt
          python3 -m compileall -q examples/python-fastapi
          PYTHONPATH=examples/python-fastapi python3 -c "from app import app; assert app.openapi_url == '/openapi.json'"

      - name: Test Rust Axum adapter
        run: |
          cargo test --manifest-path adapters/rust/Cargo.toml --all-targets
          cargo package --manifest-path adapters/rust/Cargo.toml --allow-dirty

      - name: Build Rust example against published adapter
        run: cargo check --manifest-path examples/rust-axum/Cargo.toml

      - name: Install CLI dependencies using local client bootstrap
        run: npm install --prefix tools/flexdoc-cli --no-save --ignore-scripts --no-audit --no-fund "${{ github.workspace }}/packages/client" js-yaml@^4.1.0

      - name: Test CLI build and serve contracts
        env:
          FLEXDOC_CLIENT_DIR: ${{ github.workspace }}/packages/client
        run: npm test --prefix tools/flexdoc-cli

      - name: Verify CLI package contents
        run: npm pack --prefix tools/flexdoc-cli --dry-run

      - name: Verify language-neutral renderer contract
        run: |
          test -s packages/renderer-contract/flexdoc-renderer.schema.json
          node -e "JSON.parse(require('fs').readFileSync('packages/renderer-contract/flexdoc-renderer.schema.json', 'utf8'))"

      - name: Test backend
        run: npm test -w packages/backend -- --runInBand

      - name: Build backend with packaged renderer
        run: npm run build:backend

      - name: Verify backend renderer artifacts
        run: |
          test -s packages/backend/dist/renderer/flexdoc.standalone.js
          test -s packages/backend/dist/renderer/flexdoc.standalone.css

      - name: Validate JavaScript backend examples
        run: |
          npm install --prefix examples/javascript-express --ignore-scripts --no-audit --no-fund
          npm install --prefix examples/javascript-fastify --ignore-scripts --no-audit --no-fund
          node --check examples/javascript-express/index.js
          node --check examples/javascript-fastify/index.js
          node - <<'NODE'
          const { buildApp } = require('./examples/javascript-fastify');
          (async () => {
            const app = await buildApp();
            try {
              await app.ready();
              const response = await app.inject({ method: 'GET', url: '/docs' });
              if (response.statusCode !== 200) throw new Error(`Fastify FlexDoc smoke test returned ${response.statusCode}`);
            } finally {
              await app.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Test Java Spring adapter with release profile
        run: mvn -f adapters/java-spring/pom.xml --batch-mode -Prelease -Dgpg.skip=true verify

      - name: Verify Java adapter packages renderer assets
        run: |
          JAR=adapters/java-spring/target/flexdoc-spring-boot-starter-0.2.0.jar
          jar tf "$JAR" | grep 'META-INF/flexdoc/flexdoc.standalone.js'
          jar tf "$JAR" | grep 'META-INF/flexdoc/flexdoc.standalone.css'
          test -s adapters/java-spring/target/flexdoc-spring-boot-starter-0.2.0-sources.jar
          test -s adapters/java-spring/target/flexdoc-spring-boot-starter-0.2.0-javadoc.jar

      - name: Build Spring example against published starter
        run: mvn -f examples/java-spring/pom.xml --batch-mode -DskipTests package
