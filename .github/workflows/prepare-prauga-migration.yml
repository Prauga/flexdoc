name: Prepare Prauga migration artifacts

on:
  push:
    branches: [release/prauga-package-migration]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/prauga-package-migration
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Migrate remaining Prauga identifiers
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            '@bluejeans/flexdoc-client': '@prauga/flexdoc-client',
            '@bluejeans/flexdoc-backend': '@prauga/flexdoc-backend',
            '@bluejeans/flexdoc-core': '@prauga/flexdoc-core',
            '@bluejeans/flexdoc-cli': '@prauga/flexdoc-cli',
            'https://github.com/bluejeans117/flexdoc.git': 'https://github.com/prauga/flexdoc.git',
            'https://github.com/bluejeans117/flexdoc': 'https://github.com/prauga/flexdoc',
            'https://bluejeans117.github.io/flexdoc': 'https://prauga.github.io/flexdoc',
            'io.github.bluejeans117.flexdoc': 'com.prauga.flexdoc',
            'flexdoc_adapter': 'prauga_flexdoc',
            'flexdoc-axum': 'prauga-flexdoc-axum',
            'flexdoc_axum': 'prauga_flexdoc_axum',
          }
          skip_dirs = {'.git', 'node_modules', 'dist', 'target', '.pytest_cache'}
          suffixes = {'.md','.json','.js','.mjs','.cjs','.ts','.tsx','.yml','.yaml','.toml','.xml','.java','.go','.py'}
          for path in Path('.').rglob('*'):
            if not path.is_file() or any(part in skip_dirs for part in path.parts) or path.suffix not in suffixes:
              continue
            try: text = path.read_text()
            except UnicodeDecodeError: continue
            updated = text
            for old, new in replacements.items(): updated = updated.replace(old, new)
            if updated != text: path.write_text(updated)
          PY
          mkdir -p adapters/java-spring/src/main/java/com/prauga/flexdoc/spring
          mkdir -p adapters/java-spring/src/test/java/com/prauga/flexdoc/spring
          for f in adapters/java-spring/src/main/java/io/github/bluejeans117/flexdoc/spring/*.java; do git mv "$f" adapters/java-spring/src/main/java/com/prauga/flexdoc/spring/; done
          git mv adapters/java-spring/src/test/java/io/github/bluejeans117/flexdoc/spring/FlexDocControllerTest.java adapters/java-spring/src/test/java/com/prauga/flexdoc/spring/
          sed -i 's/package io\.github\.bluejeans117\.flexdoc\.spring;/package com.prauga.flexdoc.spring;/' adapters/java-spring/src/main/java/com/prauga/flexdoc/spring/*.java adapters/java-spring/src/test/java/com/prauga/flexdoc/spring/*.java
          sed -i 's/io\.github\.bluejeans117\.flexdoc\.spring/com.prauga.flexdoc.spring/g' adapters/java-spring/src/main/resources/META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports
      - name: Regenerate root npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install and build canonical renderer
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build:client
      - name: Synchronize packaged adapter renderer assets
        run: npm run sync:adapter-assets
      - name: Refresh Rust lockfile
        run: cargo generate-lockfile --manifest-path adapters/rust/Cargo.toml
      - name: Commit generated migration artifacts and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/prepare-prauga-migration.yml
          git rm -f tools/flexdoc-cli/package-lock.json || true
          git add -A
          git commit -m "Complete Prauga namespace and generated package assets"
          git push origin HEAD:release/prauga-package-migration
