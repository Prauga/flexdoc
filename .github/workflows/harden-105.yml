name: Harden PR 105

on:
  push:
    branches:
      - tmp/3.3.x-review-hardening-runner

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: feat/3.3.1-observability-branding
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Apply requested fixes
        run: |
          git show origin/tmp/3.3.x-review-hardening-runner:scripts/harden-pr105.py > /tmp/harden-pr105.py
          python /tmp/harden-pr105.py
          git fetch origin 3.3.x
          git checkout origin/3.3.x -- adapters/elixir/assets/flexdoc.standalone.js adapters/go/assets/flexdoc.standalone.js adapters/php/assets/flexdoc.standalone.js adapters/python/src/prauga_flexdoc/_assets/flexdoc.standalone.js adapters/ruby/assets/flexdoc.standalone.js adapters/rust-actix/assets/flexdoc.standalone.js adapters/rust/assets/flexdoc.standalone.js
          git diff --check
      - name: Validate source
        run: |
          npm ci
          npm run lint
          npm test -w packages/client -- --runInBand
          npm run build:client
          npm test -w packages/backend -- --runInBand
      - name: Commit target branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: renderer/branding: keep defaults local and build stamps truthful' -m 'Replace runtime Prauga branding fetches with the inline FlexDoc mark, only set explicit favicons, hide unknown build identity, add a footer build-info opt-out, and leave vendored adapter assets for the final release refresh.'
          git push origin HEAD:feat/3.3.1-observability-branding
