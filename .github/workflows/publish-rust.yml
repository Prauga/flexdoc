name: Publish FlexDoc Rust adapter

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'rust/v')
    runs-on: ubuntu-latest
    environment: crates-io
    concurrency:
      group: flexdoc-rust-crates-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Verify release tag
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('adapters/rust/Cargo.toml','rb'))['package']['version'])")
          test "${{ github.event.release.tag_name }}" = "rust/v${VERSION}"
      - name: Require the shared host-execution crate on crates.io
        shell: bash
        run: |
          set -euo pipefail
          HOST_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('adapters/rust-host-execution/Cargo.toml','rb'))['package']['version'])")
          if cargo info "prauga-flexdoc-host-execution@${HOST_VERSION}" >/dev/null 2>&1; then
            exit 0
          fi
          echo "prauga-flexdoc-host-execution ${HOST_VERSION} is not on crates.io." >&2
          echo "Publish it first by creating the rust-host/v${HOST_VERSION} release." >&2
          exit 1
      - run: cargo test --manifest-path adapters/rust-host-execution/Cargo.toml --all-targets
      - run: cargo test --manifest-path adapters/rust/Cargo.toml --all-targets
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo package --manifest-path adapters/rust/Cargo.toml
      - name: Publish prauga-flexdoc-axum
        run: cargo publish --manifest-path adapters/rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
