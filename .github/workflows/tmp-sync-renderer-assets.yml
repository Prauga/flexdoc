name: Temporary renderer asset sync

on:
  push:
    branches: [feat/3.3.1-observability-branding]
    paths:
      - '.github/workflows/tmp-sync-renderer-assets.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/3.3.1-observability-branding
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: npm run build:client
      - run: npm run sync:adapter-assets
      - name: Commit synchronized renderer assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Vishnu R'
          git config user.email '45818225+bluejeans117@users.noreply.github.com'
          git add adapters/go/assets adapters/python/src/prauga_flexdoc/_assets adapters/rust/assets adapters/php/assets adapters/ruby/assets adapters/rust-actix/assets adapters/elixir/assets
          if git diff --cached --quiet; then
            echo 'Renderer assets already synchronized.'
            exit 0
          fi
          git commit -m 'chore: renderer/assets: sync observability build' -m 'Refresh every native adapter renderer copy from the canonical standalone build after the 3.3.x observability and remote-branding changes.'
          git push origin HEAD:feat/3.3.1-observability-branding
