name: Publish FlexDoc Rust host-execution crate

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'rust-host/v')
    runs-on: ubuntu-latest
    environment: crates-io
    concurrency:
      group: flexdoc-rust-crates-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Verify release tag
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('adapters/rust-host-execution/Cargo.toml','rb'))['package']['version'])")
          test "${{ github.event.release.tag_name }}" = "rust-host/v${VERSION}"
      - run: cargo test --manifest-path adapters/rust-host-execution/Cargo.toml --all-targets
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo package --manifest-path adapters/rust-host-execution/Cargo.toml
      - name: Publish prauga-flexdoc-host-execution
        run: cargo publish --manifest-path adapters/rust-host-execution/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
