name: Publish FlexDoc Core to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'core/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install and test core
        run: |
          npm install --prefix core --ignore-scripts --no-audit --no-fund
          npm test --prefix core
      - name: Verify release tag
        run: |
          VERSION=$(node -p "require('./core/package.json').version")
          test "${{ github.event.release.tag_name }}" = "core/v${VERSION}"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false
      - run: npm install --global npm@^11.15.0
      - run: npm pack --prefix core --dry-run
      - name: Publish @prauga/flexdoc-core
        run: npm publish --prefix core --access public
