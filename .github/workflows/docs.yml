name: Docs Contract

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'packages/*/package.json'
      - 'tools/flexdoc-cli/package.json'
      - 'scripts/check-example-versions.mjs'
      - 'scripts/check-release-doc-version-claims.mjs'
      - '.github/workflows/docs.yml'

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify pull-request patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'

      - name: Verify source-derived package and example version claims
        run: node scripts/check-example-versions.mjs

      - name: Verify release documentation version claims
        run: node scripts/check-release-doc-version-claims.mjs
