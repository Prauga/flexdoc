name: Performance Baseline

on:
  # No branch filter: stacked release work targets intermediate feature branches,
  # and a base-branch allowlist silently skips the budget gate for every one of them.
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - name: Run repeatable FlexDoc performance baseline
        run: npm run benchmark:performance -- --json performance-results.json
      - name: Enforce deterministic bundle-size budgets and headroom
        run: npm run check:performance-budgets -- performance-results.json scripts/performance/performance-policy.json
      - name: Enforce governed client workspace persistence limits
        run: npm run check:client-workspace-limits -- packages/client/src/utils/api-client-workspace.ts scripts/performance/performance-policy.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: flexdoc-performance-results
          path: performance-results.json
          if-no-files-found: error
