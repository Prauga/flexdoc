name: Rust Host Execution Parity

on:
  pull_request:
    paths:
      - 'adapters/rust/src/host_execution.rs'
      - 'adapters/rust-actix/src/host_execution.rs'
      - '.github/workflows/rust-host-execution-parity.yml'
  push:
    branches: [main]
    paths:
      - 'adapters/rust/src/host_execution.rs'
      - 'adapters/rust-actix/src/host_execution.rs'
      - '.github/workflows/rust-host-execution-parity.yml'

concurrency:
  group: rust-host-execution-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify Axum and Actix host executors are byte-identical
        run: |
          if ! cmp adapters/rust/src/host_execution.rs adapters/rust-actix/src/host_execution.rs; then
            echo 'Axum and Actix publish as independent self-contained crates, so their shared host-execution source must remain byte-identical.' >&2
            echo 'Apply framework-neutral executor changes to both files together. A future package-topology change may extract a shared published crate.' >&2
            exit 1
          fi
