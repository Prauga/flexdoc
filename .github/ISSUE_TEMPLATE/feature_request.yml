name: Feature request
description: A capability FlexDoc should have, and who it is for.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The job you cannot do today, and why the current behavior is not enough.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and which adapter or surface it belongs on.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Renderer / API reference
        - API Client
        - Host execution
        - Framework adapter
        - CLI / CI
        - Documentation
        - Other
    validations:
      required: true
