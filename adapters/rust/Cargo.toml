[package]
name = "flexdoc-axum"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Axum adapter for the canonical FlexDoc browser renderer"

[dependencies]
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
