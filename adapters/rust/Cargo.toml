[package]
name = "prauga-flexdoc-axum"
version = "0.5.5"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Self-contained Axum adapter for the Prauga FlexDoc OpenAPI renderer"
repository = "https://github.com/prauga/flexdoc"
homepage = "https://github.com/prauga/flexdoc"
readme = "README.md"
keywords = ["openapi", "axum", "api-docs", "self-hosted", "api-explorer"]
categories = ["web-programming", "development-tools"]
include = ["src/**", "assets/**", "README.md", "Cargo.toml"]

[features]
default = ["native-host-execution"]
native-host-execution = [
  "dep:prauga-flexdoc-host-execution",
  "dep:base64",
  "dep:futures-util",
  "dep:multer",
  "dep:reqwest",
  "dep:tokio",
  "dep:url",
]

[dependencies]
prauga-flexdoc-host-execution = { version = "0.1.0", path = "../rust-host-execution", optional = true }
axum = "0.8"
base64 = { version = "0.22", optional = true }
futures-util = { version = "0.3", optional = true }
multer = { version = "3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["net", "time"], optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower = { version = "0.5", features = ["util"] }


[[test]]
name = "host_execution"
path = "tests/host_execution.rs"
required-features = ["native-host-execution"]

[[test]]
name = "host_execution_security"
path = "tests/host_execution_security.rs"
required-features = ["native-host-execution"]
