[package]
name = "prauga-flexdoc-actix"
version = "0.4.5"
edition = "2021"
rust-version = "1.84"
description = "Self-hosted FlexDoc OpenAPI renderer integration for Actix Web"
license = "AGPL-3.0-or-later"
repository = "https://github.com/prauga/flexdoc"
homepage = "https://github.com/prauga/flexdoc"
readme = "README.md"
keywords = ["openapi", "actix", "api-documentation", "flexdoc"]
categories = ["web-programming", "development-tools"]
include = ["src/**", "assets/**", "README.md", "LICENSE", "Cargo.toml"]

[features]
default = ["host-execution"]
host-execution = [
  "dep:prauga-flexdoc-host-execution",
  "prauga-flexdoc-host-execution/host-execution",
  "dep:futures-util",
  "dep:multer",
]

[dependencies]
prauga-flexdoc-host-execution = { version = "0.1.0", path = "../rust-host-execution", optional = true, default-features = false }
actix-web = "4"
futures-util = { version = "0.3", optional = true }
multer = { version = "3", optional = true }
serde_json = "1"

[dev-dependencies]
actix-rt = "2"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
