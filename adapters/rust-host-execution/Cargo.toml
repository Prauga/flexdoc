[package]
name = "prauga-flexdoc-host-execution"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Framework-neutral native host-execution engine for Prauga FlexDoc Rust adapters"
repository = "https://github.com/prauga/flexdoc"
homepage = "https://github.com/prauga/flexdoc"
readme = "README.md"
keywords = ["openapi", "http", "ssrf", "api-docs", "flexdoc"]
categories = ["web-programming", "development-tools"]
include = ["src/**", "README.md", "Cargo.toml"]

[features]
default = ["host-execution"]
host-execution = ["dep:base64", "dep:futures-util", "dep:reqwest", "dep:serde_json", "dep:tokio", "dep:url"]

[dependencies]
base64 = { version = "0.22", optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["net", "time"], optional = true }
url = { version = "2", optional = true }

# Test-only: the executor is async, so its tests need a runtime and the `#[tokio::test]`
# attribute. This does not widen what a consumer of the crate compiles.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
