[package]
name = "prauga-flexdoc-host-execution"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Framework-neutral native host-execution engine for Prauga FlexDoc Rust adapters"
repository = "https://github.com/prauga/flexdoc"
homepage = "https://github.com/prauga/flexdoc"
readme = "README.md"
keywords = ["openapi", "http", "ssrf", "api-docs", "flexdoc"]
categories = ["web-programming", "development-tools"]
include = ["src/**", "README.md", "Cargo.toml"]

[dependencies]
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time"] }
url = "2"
