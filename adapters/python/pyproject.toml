[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prauga-flexdoc"
version = "0.3.0"
description = "Self-contained ASGI and WSGI adapters for the Prauga FlexDoc OpenAPI renderer"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{name = "Prauga"}]
keywords = ["openapi", "api-documentation", "api-explorer", "asgi", "wsgi", "fastapi", "flask", "django", "starlette", "self-hosted", "flexdoc"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Framework :: AsyncIO",
  "Framework :: Flask",
  "Framework :: Django",
  "Operating System :: OS Independent",
  "Topic :: Documentation",
  "Topic :: Software Development :: Libraries :: Application Frameworks"
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115"]
flask = ["flask>=3.0"]
django = ["django>=5.0"]

[project.urls]
Homepage = "https://github.com/prauga/flexdoc"
Repository = "https://github.com/prauga/flexdoc"
Issues = "https://github.com/prauga/flexdoc/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prauga_flexdoc = ["_assets/*.js", "_assets/*.css"]
