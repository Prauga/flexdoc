[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flexdoc-adapter"
version = "0.1.0"
description = "Framework-neutral ASGI adapter for the FlexDoc API reference renderer"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}

[tool.setuptools.packages.find]
where = ["src"]
